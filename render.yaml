services:
  # FastAPI Computer Vision Backend
  - type: web
    name: faceguard-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install --no-cache-dir -r requirements.txt
    startCommand: python3 main.py
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./face_mask_monitoring.db
      - key: CORS_ORIGINS
        value: "*"
