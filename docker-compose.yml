version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: facemask_postgres
    environment:
      POSTGRES_DB: face_mask_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_mask_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend & CNN Inference Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facemask_backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/face_mask_monitoring
      SECRET_KEY: production-jwt-secret-key-face-mask-compliance-2026
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facemask_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
